<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Location &amp; Logistics — AGROCONNECT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header id="siteHeader"></header>

  <main>
    <section class="page-banner">
      <div class="container">
        <span class="pill pill-green">Google Maps &amp; Route Freight Intelligence</span>
        <h1>Location &amp; Logistics Hub</h1>
        <p>Identify nearby agricultural waste suppliers, compute exact seller-to-buyer distances, and estimate freight costs and delivery windows.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <!-- Buyer Delivery & Transport Controls -->
        <div class="card card-pad" style="margin-bottom:24px;">
          <div class="grid-logistics-bar">
            <div class="form-group" style="margin-bottom:0;">
              <label for="logBuyerHub">Your Factory / Delivery City</label>
              <select class="form-control" id="logBuyerHub"></select>
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label for="logCategory">Filter Waste Category</label>
              <select class="form-control" id="logCategory">
                <option value="">All Categories</option>
                <option value="Banana Stem">Banana Stem</option>
                <option value="Lotus Stem">Lotus Stem</option>
                <option value="Sugarcane Bagasse">Sugarcane Bagasse</option>
                <option value="Coconut Husk">Coconut Husk</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label for="logWeight">Shipment Weight (kg)</label>
              <input class="form-control" type="number" id="logWeight" min="100" step="100" value="2500" />
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label for="logVehicle">Transport Vehicle</label>
              <select class="form-control" id="logVehicle"></select>
            </div>
            <button type="button" class="btn btn-outline" id="detectBuyerGpsBtn">Use My GPS</button>
          </div>
        </div>

        <div class="grid-logistics-split">
          <!-- Map Area -->
          <div class="card card-pad">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
              <h3 style="margin:0;color:var(--forest-900);">Supplier Proximity Map</h3>
              <span class="pill pill-earth" id="mapEngineBadge">Geo-Grid Active</span>
            </div>
            <div class="map-box" id="logisticsMap"></div>
            <div id="selectedRouteSummary" style="margin-top:16px;padding:16px;border-radius:12px;background:var(--leaf-50);border:1px solid var(--leaf-100);"></div>
          </div>

          <!-- Nearby Suppliers Ranked List -->
          <div class="card card-pad">
            <h3 style="margin:0 0 12px;color:var(--forest-900);">Nearby Suppliers (Sorted by Distance)</h3>
            <div id="nearbySuppliersList" style="display:flex;flex-direction:column;gap:12px;max-height:540px;overflow-y:auto;"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script src="js/config.js"></script>
  <script src="js/geo-service.js"></script>
  <script src="js/matching-service.js"></script>
  <script src="js/db-service.js"></script>
  <script src="js/ui-shell.js"></script>
  <script src="js/pages/logistics.js"></script>
</body>
</html>
